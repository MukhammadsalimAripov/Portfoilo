<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="2; url=http://localhost:3000">
  <title>Next.js Portfolio — Muhammadsalim</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0b0f19;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .box {
      max-width: 520px;
      padding: 40px;
      background: #111827;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 20px;
    }
    code {
      display: block;
      background: #1a2234;
      padding: 12px;
      border-radius: 12px;
      font-family: monospace;
      color: #a5b4fc;
      margin: 10px 0;
      text-align: left;
    }
    a {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 24px;
      border-radius: 12px;
      background: #6366f1;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>🚀 Next.js Portfolio Project</h1>
    <p>Проект перенесён на <strong>Next.js 14 (App Router, Tailwind CSS, TypeScript)</strong>!</p>
    <p>Для запуска выполните в терминале:</p>
    <code>npm install<br>npm run dev</code>
    <a href="http://localhost:3000">Перейти на http://localhost:3000</a>
  </div>
</body>
</html>
